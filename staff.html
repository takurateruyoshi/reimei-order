<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>黎明祭 オーダー スタッフ</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://accounts.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
</head>
<body>
<div class="wrap wide">
  <header class="top">
    <div class="brand"><small>スタッフ</small><b id="shop"></b></div>
    <div class="spacer"></div>
    <div class="who" id="who" hidden></div>
  </header>
  <div class="demo" id="demo" hidden>デモモード <a href="index.html" target="_blank">お客さん画面</a></div>

  <section class="gate" id="gate" hidden>
    <h2>スタッフ用ページ</h2>
    <div id="gbtn"></div>
    <p class="err" id="gateErr" hidden></p>
  </section>

  <main id="main" class="loading" style="display:flex;flex-direction:column;gap:16px">
    <div class="net-off" id="netOff" hidden>通信できません。つながると自動で最新になります。その間の注文は、パソコンのスプレッドシート「注文」シートに直接書いてください</div>
    <div class="banner" id="state">読み込んでいます…</div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="kitchen" aria-selected="true">受け渡し <span class="count" id="cKitchen">0</span></button>
      <button role="tab" data-tab="counter" aria-selected="false">店頭で注文</button>
      <button role="tab" data-tab="admin" aria-selected="false">管理</button>
    </nav>

    <section data-panel="kitchen" class="col">
      <div class="handoff-head">
        <p class="muted">上から順に作り、渡したら「渡した」を2回押すか、お客さんのQRを読み取ってください</p>
        <button class="link-btn" type="button" id="scanQR">QRを読む</button>
      </div>
      <div class="col" id="colNew"><div class="ocard sk-card"></div><div class="ocard sk-card"></div><div class="ocard sk-card"></div></div>
    </section>

    <section data-panel="counter" class="panel" hidden>
      <section class="menu-book" id="cCodes" aria-label="メニュー"></section>
    </section>

    <section data-panel="admin" hidden style="display:flex;flex-direction:column;gap:16px">
      <div class="panel">
        <div class="row"><span>今日は</span><div class="seg" id="daySeg"><button type="button" data-day="1">1日目</button><button type="button" data-day="2">2日目</button></div></div>
        <div class="row"><button class="switch" role="switch" id="openSw" aria-checked="false" aria-label="受付"></button><span id="openLabel"></span></div>
      </div>
      <div class="panel">
        <h2>メニュー</h2>
        <div class="bars" id="soldOut"></div>
      </div>
      <div class="panel">
        <h2>今日の数</h2>
        <div class="tiles" id="tiles"></div>
        <a class="btn" id="sheetLink" target="_blank" rel="noopener" hidden>スプレッドシートを開く</a>
      </div>
    </section>
  </main>
</div>
<div class="bar" id="cBar" hidden>
  <div class="in">
    <div class="cart-cups" id="cCups"></div>
    <div class="sum"><b id="cCount"></b><span>店頭の注文</span></div>
    <button class="go" id="cNext" type="button">注文へ</button>
  </div>
</div>
<div class="sheet-bg" id="cSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cSheetTitle">
    <div class="sheet-head"><h2 id="cSheetTitle">店頭の注文</h2><button class="x" id="cClose" type="button" aria-label="閉じる">×</button></div>
    <ul class="lines" id="cLines"></ul>
    <div class="choose">
      <div class="opt-card">
        <div class="tagp free" id="cStuTag">学部生</div>
        <input id="cSid" class="sid-input" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="学籍番号7桁" autocomplete="off">
        <button class="gbtn card" type="button" id="cScan">学生証を読み取る</button>
        <small id="cSidInfo">学籍番号を入れると無料の杯数が出ます</small>
        <button class="go" type="button" id="cAsStu" disabled>学部生で注文</button>
      </div>
      <div class="opt-card">
        <div class="tagp paid">一般</div>
        <div class="big" id="cGenPrice"></div>
        <button class="go" type="button" id="cAsGen">一般で注文</button>
        <small>現金で受け取る</small>
      </div>
    </div>
    <p class="err" id="cErr" hidden></p>
    <div class="c-done" id="cDone" hidden></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="js/staff.js"></script>
</body>
</html>
