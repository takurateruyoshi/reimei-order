<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黎明祭 オーダー スタッフ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap wide">
  <header class="top">
    <div class="brand"><small>スタッフ</small><b id="shop"></b></div>
    <div class="spacer"></div>
    <div class="who" id="who" hidden></div>
  </header>
  <div class="demo" id="demo" hidden>デモモード <a href="index.html" target="_blank">お客さん画面</a></div>

  <section class="gate" id="gate">
    <h2>スタッフ用ページ</h2>
    <div id="gbtn"></div>
    <p class="err" id="gateErr" hidden></p>
  </section>

  <main id="main" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="banner" id="state"></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="kitchen" aria-selected="true">厨房 <span class="count" id="cKitchen">0</span></button>
      <button role="tab" data-tab="handoff" aria-selected="false">受け渡し <span class="count" id="cHandoff">0</span></button>
      <button role="tab" data-tab="counter" aria-selected="false">店頭で注文</button>
      <button role="tab" data-tab="admin" aria-selected="false">管理</button>
    </nav>

    <section data-panel="kitchen" class="cols">
      <div class="col"><h3><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" class="line"/><path d="M9 8h6M9 12h6" class="line"/></svg>新しい注文</h3><div class="col" id="colNew"></div></div>
      <div class="col"><h3><svg viewBox="0 0 24 24"><path d="M5 9h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z" class="line"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17" class="line"/></svg>作っている</h3><div class="col" id="colMaking"></div></div>
    </section>

    <section data-panel="handoff" class="col handoff" hidden id="colReady"></section>

    <section data-panel="counter" class="panel" hidden>
      <div class="seg" id="cType"><button type="button" data-type="student" aria-pressed="true">学部生（学生証を確認）</button><button type="button" data-type="general" aria-pressed="false">一般</button></div>
      <div class="codes" id="cCodes"></div>
      <ul class="lines" id="cLines"></ul>
      <div class="row"><button class="go" type="button" id="cGo" disabled>注文を入れる</button><span id="cResult"></span></div>
    </section>

    <section data-panel="admin" hidden style="display:flex;flex-direction:column;gap:16px">
      <div class="panel">
        <div class="row"><span>今日は</span><div class="seg" id="daySeg"><button type="button" data-day="1">1日目</button><button type="button" data-day="2">2日目</button></div></div>
        <div class="row"><button class="switch" role="switch" id="openSw" aria-checked="false" aria-label="受付"></button><span id="openLabel"></span></div>
      </div>
      <div class="panel">
        <h2>メニュー</h2>
        <div class="bars" id="soldOut"></div>
      </div>
      <div class="panel">
        <h2>今日の数</h2>
        <div class="tiles" id="tiles"></div>
        <a class="btn" id="sheetLink" target="_blank" rel="noopener" hidden>スプレッドシートを開く</a>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="js/staff.js"></script>
</body>
</html>
