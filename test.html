<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>通信テスト｜黎明祭 モバイルオーダー</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="stylesheet" href="css/style.css">
<style>
  .wrap { max-width: 480px; padding-block: 20px 40px; }
  h1 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  label { display: block; font-weight: 700; font-size: 14px; margin: 14px 0 6px; }
  .f { width: 100%; font-size: 18px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
  .nets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .nets button { padding: 12px 4px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; }
  .nets button[aria-pressed="true"] { border-color: var(--dawn); background: var(--dawn-soft); }
  .go { width: 100%; margin-top: 20px; padding: 16px; border: 0; border-radius: 14px; background: var(--dawn); color: #fff; font-weight: 700; font-size: 18px; }
  .go:disabled { opacity: .45; }
  .ring { display: grid; place-items: center; margin: 24px auto 8px; width: 200px; height: 200px; position: relative; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 14; }
  .ring .bg { stroke: var(--line); }
  .ring .fg { stroke: var(--dawn); stroke-linecap: round; transition: stroke-dashoffset .5s linear; }
  .ring.wait .fg { stroke: var(--sky); }
  .ring b { font-family: var(--f-num); font-size: 44px; line-height: 1; }
  .ring small { display: block; text-align: center; color: var(--muted); font-size: 13px; }
  .live { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 14px; margin: 8px 0; }
  .live i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .live i.slow { background: var(--dawn); }
  .live i.ng { background: var(--danger); }
  .verdict { text-align: center; font-family: var(--f-display); font-size: 30px; margin: 16px 0 4px; }
  .verdict.good { color: var(--ok); } .verdict.mid { color: var(--dawn); } .verdict.bad { color: var(--danger); }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 15px; }
  td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
  th { text-align: left; padding: 14px 4px 4px; font-size: 13px; color: var(--muted); border-bottom: 2px solid var(--line); }
  td:last-child { text-align: right; font-family: var(--f-num); }
  pre { white-space: pre-wrap; font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>通信テスト</h1>
  <p class="lead">みんなで同じ時刻に始めて、<b>回線（Wi-Fi・携帯回線）</b>と<b>アプリ（注文サーバー）</b>のどちらが詰まるかを約1分はかります。注文は入りません。</p>

  <section id="setup">
    <label for="who">名前（だれのスマホか）</label>
    <input id="who" class="f" autocomplete="off" placeholder="例：たくら">
    <label>いまの回線</label>
    <div class="nets" id="nets">
      <button type="button">MU-NET</button><button type="button">docomo</button><button type="button">au</button>
      <button type="button">SoftBank</button><button type="button">楽天</button><button type="button">その他</button>
    </div>
    <label for="place">場所</label>
    <input id="place" class="f" autocomplete="off" placeholder="例：1号館前">
    <button class="go" id="go" type="button" disabled>次のちょうど0秒から始める</button>
  </section>

  <section id="run" hidden>
    <div class="ring" id="ring">
      <svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="86"/><circle class="fg" id="arc" cx="100" cy="100" r="86"/></svg>
      <div><b id="num">0</b><small id="sub">開始まで</small></div>
    </div>
    <div class="live" id="live"></div>
  </section>

  <section id="result" hidden>
    <div class="verdict" id="verdict"></div>
    <table id="tbl"></table>
    <button class="go" id="copy" type="button">結果をコピー（LINEに貼る）</button>
    <pre id="raw"></pre>
    <button class="go" id="again" type="button" style="background:var(--sky)">もう一度</button>
  </section>
</main>
<script type="module">
import { API_URL } from "./js/config.js";
const $ = (id) => document.getElementById(id);
const DURATION = 60, EVERY = 2000, C = 2 * Math.PI * 86;
$("arc").style.strokeDasharray = C;

let net_ = "";
$("nets").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  net_ = b.textContent;
  for (const x of $("nets").children) x.setAttribute("aria-pressed", x === b);
  check();
};
const check = () => ($("go").disabled = !($("who").value.trim() && net_));
$("who").oninput = check;
try { $("who").value = localStorage.getItem("nettest-who") || ""; $("place").value = localStorage.getItem("nettest-place") || ""; } catch {}

async function req(action) {
  const t = performance.now();
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 20000);
    const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action }), signal: ctrl.signal });
    clearTimeout(to);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    return { ok: true, ms: Math.round(performance.now() - t) };
  } catch (e) {
    return { ok: false, ms: Math.round(performance.now() - t), err: e.name === "AbortError" ? "20秒で応答なし" : "つながらない" };
  }
}

const setRing = (frac, n, sub, wait) => {
  $("arc").style.strokeDashoffset = C * (1 - frac);
  $("ring").classList.toggle("wait", wait);
  $("num").textContent = n; $("sub").textContent = sub;
};
const dot = (r) => {
  const i = document.createElement("i");
  i.className = !r.ok ? "ng" : r.ms > 3000 ? "slow" : "";
  $("live").append(i);
};

// 回線だけの速さ：小さいファイルの往復5回（応答の速さ）と、約100KBのダウンロード（下りの速さ）
const PROBE = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/package.json";
const BIG = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js", BIG_BYTES = 99000;
async function timed(url, ms = 10000) {
  const t = performance.now();
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), ms);
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "nocache=" + Math.random(), { cache: "no-store", signal: ctrl.signal });
    await r.arrayBuffer(); clearTimeout(to);
    return r.ok ? Math.round(performance.now() - t) : null;
  } catch { return null; }
}
async function netCheck() {
  const rtts = [];
  for (let i = 0; i < 5; i++) { const v = await timed(PROBE); rtts.push(v); dot(v == null ? { ok: false } : { ok: true, ms: v }); }
  const ok = rtts.filter((v) => v != null).sort((a, b) => a - b);
  const dl = await timed(BIG, 20000);
  return { rtt: ok.length ? ok[Math.floor(ok.length / 2)] : null, lost: 5 - ok.length, mbps: dl ? (BIG_BYTES * 8) / (dl / 1000) / 1e6 : null };
}

$("go").onclick = async () => {
  try { localStorage.setItem("nettest-who", $("who").value.trim()); localStorage.setItem("nettest-place", $("place").value.trim()); } catch {}
  $("setup").hidden = true; $("run").hidden = false; $("live").textContent = "";
  // みんなが同時に始められるよう、次の「ちょうど0秒」まで待つ
  const start = Math.ceil((Date.now() + 3000) / 60000) * 60000;
  const waitTotal = start - Date.now();
  await new Promise((done) => {
    const tick = () => {
      const left = start - Date.now();
      if (left <= 0) return done();
      setRing(1 - left / waitTotal, Math.ceil(left / 1000), "開始まで", true);
      setTimeout(tick, 200);
    };
    tick();
  });

  // ① 回線チェック：注文サーバーを通さず、配信サーバー（CDN）までの速さだけをはかる
  $("sub").textContent = "回線をはかっています";
  const net = await netCheck();

  const results = [];
  const first = await req("state");   // 注文画面を開いたときの読み込み
  results.push({ ...first, kind: "state" }); dot(first);
  const end = start + DURATION * 1000;
  const timer = setInterval(() => {
    const left = Math.max(0, end - Date.now());
    setRing(1 - left / (DURATION * 1000), Math.ceil(left / 1000), "のこり秒", false);
  }, 250);
  while (Date.now() < end) {
    const t = Date.now();
    const r = await req("rev");       // 2秒ごとの「変更あった？」
    results.push({ ...r, kind: "rev" }); dot(r);
    await new Promise((x) => setTimeout(x, Math.max(0, EVERY - (Date.now() - t))));
  }
  clearInterval(timer);
  show(results, start, net);
};

// 1回の更新で使う通信量（11/13に実測：ヘッダー込みで下り約3.9KB＋上り約0.5KB）
const KB_PER_POLL = 4.4, APP_EVERY_SEC = 5;
function show(results, start, net) {
  const ok = results.filter((r) => r.ok), ms = ok.map((r) => r.ms).sort((a, b) => a - b);
  const q = (p) => (ms.length ? ms[Math.min(ms.length - 1, Math.floor(ms.length * p))] : null);
  const rate = Math.round((ok.length / results.length) * 100);
  const p50 = q(0.5), p90 = q(0.9);
  const errs = {}; results.filter((r) => !r.ok).forEach((r) => (errs[r.err] = (errs[r.err] || 0) + 1));

  // どちらが詰まっているか
  const netBad = net.rtt == null || net.lost >= 2 || net.rtt > 1500 || (net.mbps != null && net.mbps < 0.1);
  const appBad = rate < 98 || (p90 ?? 99999) > 3000;
  const server = p50 != null && net.rtt != null ? Math.max(0, p50 - net.rtt) : null;
  const v = !netBad && !appBad ? ["good", "問題なし"]
    : netBad && !appBad ? ["mid", "回線が遅い（アプリは動く）"]
    : netBad ? ["bad", "回線側がボトルネック"]
    : ["bad", "アプリ（サーバー）側がボトルネック"];

  const needKbps = (KB_PER_POLL * 8) / APP_EVERY_SEC;   // アプリ1台に必要な速さ（kbps）
  const t = new Date(start);
  const rows = [
    ["section", "回線（Wi-Fi・携帯回線）"],
    ["応答の速さ", net.rtt != null ? net.rtt + "ms" : "失敗"],
    ["下りの速さ（目安）", net.mbps != null ? net.mbps.toFixed(1) + "Mbps" : "失敗"],
    ["届かなかった回数", `${net.lost}/5回`],
    ["section", "アプリ（注文サーバー）"],
    ["成功", `${ok.length}/${results.length}（${rate}%）`],
    ["注文画面の読み込み", results[0].ok ? fmt(results[0].ms) : "失敗"],
    ["ふつうの待ち時間", fmt(p50)],
    ["遅いとき（10回に1回）", fmt(p90)],
    ["サーバーでかかった時間（目安）", fmt(server)],
    ...Object.entries(errs).map(([k, n]) => [k, `${n}回`]),
    ["section", "必要な通信量"],
    ["アプリ1台に必要な速さ", `約${needKbps.toFixed(0)}kbps`],
    ["この回線の余裕", net.mbps != null ? `約${Math.floor((net.mbps * 1000) / needKbps)}台分` : "-"],
  ];
  $("verdict").className = "verdict " + v[0]; $("verdict").textContent = v[1];
  $("tbl").innerHTML = rows.map(([a, b]) => a === "section" ? `<tr><th colspan="2">${b}</th></tr>` : `<tr><td>${a}</td><td>${b}</td></tr>`).join("");
  const text = [`【通信テスト】${v[1]}`, `${$("who").value.trim()}／${net_}／${$("place").value.trim() || "場所未記入"}`,
    `${t.getMonth() + 1}/${t.getDate()} ${t.getHours()}:${String(t.getMinutes()).padStart(2, "0")}開始`,
    ...rows.map(([a, b]) => (a === "section" ? `■${b}` : `${a}：${b}`))].join("\n");
  $("raw").textContent = text;
  $("run").hidden = true; $("result").hidden = false;
}
const fmt = (n) => (typeof n === "number" ? (n / 1000).toFixed(1) + "秒" : "-");

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("raw").textContent); $("copy").textContent = "コピーしました"; }
  catch { getSelection().selectAllChildren($("raw")); $("copy").textContent = "下の文字を長押しでコピー"; }
};
$("again").onclick = () => { $("result").hidden = true; $("setup").hidden = false; $("copy").textContent = "結果をコピー（LINEに貼る）"; };
</script>
</body>
</html>
